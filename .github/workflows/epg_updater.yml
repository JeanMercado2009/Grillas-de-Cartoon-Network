name: Actualizacion Diaria EPG Cartoon Network Panregional

on:
  schedule:
    # 20:00 COT (UTC-5) = 01:00 UTC
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests pandas xlrd openpyxl beautifulsoup4 html5lib

      - name: Descargar y Procesar Grilla
        env:
          TAPKIT_TOKEN: ${{ secrets.TAPKIT_TOKEN }}
          TAPKIT_REFRESH_TOKEN: ${{ secrets.TAPKIT_REFRESH_TOKEN }}
        run: |
          python updater.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CNLA_EPG.xml
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en la grilla."
          else
            git commit -m "Auto-update EPG Panregional: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
