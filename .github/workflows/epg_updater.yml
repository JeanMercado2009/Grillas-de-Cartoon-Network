name: Actualizacion Diaria EPG Cartoon Network Panregional

on:
  schedule:
    # 20:00 COT (UTC-5) equivale a 01:00 UTC del día siguiente
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias y Chromium
        run: |
          pip install playwright pandas xlrd openpyxl
          playwright install --with-deps chromium

      - name: Ejecutar Extractor y Actualizador EPG
        env:
          TAPKIT_EMAIL: ${{ secrets.TAPKIT_EMAIL }}
          TAPKIT_PASSWORD: ${{ secrets.TAPKIT_PASSWORD }}
        run: |
          python updater.py

      - name: Guardar y subir cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add CNLA_EPG.xml
          if git diff --staged --quiet; then
            echo "No hay cambios nuevos en la grilla."
          else
            git commit -m "Auto-update EPG Panregional: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
